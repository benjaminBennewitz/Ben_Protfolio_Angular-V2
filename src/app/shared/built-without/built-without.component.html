<!-- src/app/shared/built-without/built-without.component.html -->
<section class="built-strip" id="quality" bpViewportActivity>
  <div class="built-strip__layout bp-container">
    <div class="built-strip__copy bp-motion-copy" bpReveal>
      <bp-reveal-text class="built-strip__title-reveal" [eyebrow]="content().eyebrow" [text]="content().title" />
      <p>{{ content().text }}</p>
    </div>

    <div class="built-strip__groups bp-stagger-list bp-stagger-list--right" bpReveal>
      <article class="built-strip__group built-strip__group--without bp-stagger-item" [style.--bp-stagger-delay.ms]="120">
        <h3>{{ content().withoutLabel }}</h3>
        <ul>
          @for (item of content().withoutItems; track $index) {
          <li><span class="material-symbols-outlined" aria-hidden="true">close</span>{{ item }}</li>
          }
        </ul>
      </article>

      <article class="built-strip__group built-strip__group--capabilities bp-stagger-item" [style.--bp-stagger-delay.ms]="240">
        <h3>{{ content().capabilityLabel }}</h3>
        <ul>
          @for (item of content().capabilityItems; track $index) {
          <li><span class="material-symbols-outlined" aria-hidden="true">check</span>{{ item }}</li>
          }
        </ul>
      </article>
    </div>
  </div>
</section>
