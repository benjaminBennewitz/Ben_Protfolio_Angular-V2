<!-- src/app/app.component.html -->
<bp-critical-styles />
<bp-loader (shellRequested)="prepareShell()" (humanConfirmed)="markLoaderHumanConfirmed()" />

<div class="app-shell">
  <router-outlet />
</div>

@defer (when shellReady()) {
  <bp-app-runtime [loaderHumanConfirmed]="loaderHumanConfirmed()" />
  <bp-custom-cursor />
  <bp-scroll-to-top />
  <bp-navigation />
  <bp-accessibility-panel />
  <bp-achievement-toast />
  <bp-platinum-completion-modal />
  <bp-cookie-banner />
  <bp-system-toast />

  @if (showFooter()) {
    <bp-footer />
  }
}
