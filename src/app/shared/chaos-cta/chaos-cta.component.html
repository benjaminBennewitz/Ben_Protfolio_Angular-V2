<!-- src/app/shared/chaos-cta/chaos-cta.component.html -->
<section #stageRef class="chaos-cta" id="cta" role="link" tabindex="0" data-cursor="chaos"
  aria-label="Zur Kontaktsection springen" (click)="goToContact()" (keydown)="onKeyDown($event)"
  (pointermove)="onPointerMove($event)" (pointerleave)="onPointerLeave()">
  <div class="chaos-cta__copy bp-motion-copy" bpReveal>
    <bp-reveal-text class="chaos-cta__title-reveal" [eyebrow]="eyebrow" [text]="title" />
    <p>{{ hint }}</p>
  </div>

  <div class="chaos-cta__floor" aria-hidden="true"></div>

  <div class="chaos-cta__blocks" aria-hidden="true">
    @for (word of words; track word; let index = $index) {
    <span class="chaos-cta__block" [class.chaos-cta__block--icon]="isIconBlock(word)"
      [style.width]="styleAt(index, 'width')" [style.height]="styleAt(index, 'height')"
      [style.transform]="styleAt(index, 'transform')">
      @if (isIconBlock(word)) {
      <span class="material-symbols-outlined" aria-hidden="true">{{ iconName(word) }}</span>
      } @else {
      {{ word }}
      }
    </span>
    }
  </div>

  <div class="chaos-cta__car"
    [class.chaos-cta__car--driving]="carPhase() === 'driving'"
    [class.chaos-cta__car--crashed]="carPhase() === 'crashed'"
    [class.chaos-cta__car--gone]="carPhase() === 'gone'"
    [style.opacity]="carStyle().opacity"
    [style.transform]="carStyle().transform"
    [style.width]="carStyle().width"
    aria-hidden="true">
    <bp-pixel-sprite kind="car" direction="left" />
    <span class="chaos-cta__crash-pixel chaos-cta__crash-pixel--one"></span>
    <span class="chaos-cta__crash-pixel chaos-cta__crash-pixel--two"></span>
    <span class="chaos-cta__crash-pixel chaos-cta__crash-pixel--three"></span>
    <span class="chaos-cta__crash-pixel chaos-cta__crash-pixel--four"></span>
  </div>

  @if (isDialogVisible()) {
  <aside class="chaos-cta__dialog" aria-label="HEY_THERE.DLL Dialog">
    <div class="chaos-cta__dialog-bar">
      <strong>HEY_THERE.DLL</strong>
      <button type="button" aria-label="HEY_THERE.DLL schließen" (click)="closeDialog($event)">×</button>
    </div>
    <span>move cursor</span>
    <button type="button" (click)="closeDialog($event)">OK</button>
  </aside>
  }
</section>
