<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevMode Console Demo</title>
  <style>
/*###############################
###
###     snippet-demo.css
###     Portfolio Snippet Demo
###     BASED ON: HTML, CSS, Browser APIs
###     AUTHOR: Benjamin Bennewitz
###
###
###       ██████╗  ▀█
###       ██╔══██╗ █▄
###       ██████╦╝
###       ██╔══██╗
###       ██████╦╝
###       ╚═════╝
###
###
#################################*/

    :root {
      color-scheme: dark;
      --bg: #101010;
      --text: #f6f0e8;
      --accent: #a7ff19;
      --muted: rgba(246, 240, 232, .72);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: clamp(1rem, 4vw, 2rem);
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    .demo-shell {
      display: grid;
      gap: 1rem;
      max-width: 760px;
      margin: auto;
    }


    .demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }

    .demo-brand {
      display: inline-grid;
      place-items: center;
      width: 2.35rem;
      height: 2.35rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #101010;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .demo-tag {
      width: fit-content;
      border: 1px solid var(--accent);
      padding: .25rem .55rem;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .demo-note {
      border: 2px solid var(--accent);
      padding: 1rem;
      background: rgba(167, 255, 25, .06);
    }

    .demo-note p {
      margin: .35rem 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    @media (max-width: 520px) {
      .demo-shell {
        gap: .75rem;
      }
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <header class="demo-header">
      <span class="demo-brand" aria-hidden="true">B²</span>
      <span class="demo-tag">DevTools Demo</span>
    </header>
    <article class="demo-note">
      <strong>Konsole öffnen:</strong>
      <p>In Chrome DevTools erscheint eine gestaltete Debug-Meldung. Das ist nützlich für lokale Feature-Flags und Entwicklungsmarker.</p>
    </article>
  </main>

  <script>
    const style = [
      'background:#101010',
      'color:#a7ff19',
      'border:2px solid #a7ff19',
      'padding:8px 12px',
      'font-weight:900'
    ].join(';');

    console.log('%cDEVMODE ACTIVATED', style);
  </script>
</body>
</html>
