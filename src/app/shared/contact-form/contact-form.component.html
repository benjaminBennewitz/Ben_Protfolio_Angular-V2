<!-- src/app/shared/contact-form/contact-form.component.html -->
<form class="contact-form bp-card" bpReveal (ngSubmit)="submit()" novalidate>
  <p class="contact-form__required-hint">{{ content().requiredHint }}</p>

  <div class="contact-form__honeypot" aria-hidden="true">
    <label>
      <span>{{ content().honeypotLabel }}</span>
      <input type="text" tabindex="-1" autocomplete="off" [value]="website()" (input)="updateField('website', $event)">
    </label>
  </div>

  <div class="contact-form__layout">
    <div class="contact-form__fields">
      <div class="contact-form__field-row">
        <label [attr.for]="nameId" [class.has-error]="fieldHasError('name')">
          <span>{{ content().nameLabel }} <b aria-hidden="true">*</b><span class="bp-sr-only">{{ content().requiredMarkLabel }}</span></span>
          <input [id]="nameId" type="text" autocomplete="name" [value]="name()" (input)="updateField('name', $event)"
            [attr.aria-invalid]="fieldHasError('name')" [attr.aria-describedby]="fieldDescribedBy('name')" aria-required="true" required minlength="2">
          @if (fieldHasError('name')) {
          <small [id]="nameErrorId" class="contact-form__error">{{ fieldError('name') }}</small>
          }
        </label>

        <label [attr.for]="emailId" [class.has-error]="fieldHasError('email')">
          <span>{{ content().emailLabel }} <b aria-hidden="true">*</b><span class="bp-sr-only">{{ content().requiredMarkLabel }}</span></span>
          <input [id]="emailId" type="email" autocomplete="email" [value]="email()" (input)="updateField('email', $event)"
            [attr.aria-invalid]="fieldHasError('email')" [attr.aria-describedby]="fieldDescribedBy('email')" aria-required="true" required>
          @if (fieldHasError('email')) {
          <small [id]="emailErrorId" class="contact-form__error">{{ fieldError('email') }}</small>
          }
        </label>
      </div>

      <label [attr.for]="messageId" [class.has-error]="fieldHasError('message')">
        <span>{{ content().messageLabel }} <b aria-hidden="true">*</b><span class="bp-sr-only">{{ content().requiredMarkLabel }}</span></span>
        <textarea [id]="messageId" rows="5" [value]="message()" (input)="updateField('message', $event)"
          [attr.aria-invalid]="fieldHasError('message')" [attr.aria-describedby]="fieldDescribedBy('message')" aria-required="true" required minlength="10"></textarea>
        @if (fieldHasError('message')) {
        <small [id]="messageErrorId" class="contact-form__error">{{ fieldError('message') }}</small>
        }
      </label>

      <div class="contact-form__privacy" [class.has-error]="privacyHasError()">
        <label class="contact-form__consent" [attr.for]="privacyId">
          <input [id]="privacyId" type="checkbox" [checked]="privacyAccepted()"
            (change)="updatePrivacyConsent($event)" [attr.aria-invalid]="privacyHasError()"
            [attr.aria-describedby]="privacyHasError() ? privacyErrorId : null" aria-required="true" required>
          <span class="contact-form__checkbox" aria-hidden="true"></span>
          <span class="contact-form__consent-copy">{{ content().privacy }}</span>
        </label>

        <a class="contact-form__privacy-link" routerLink="/datenschutz">
          <span>{{ content().privacyLinkLabel }}</span>
          <span class="material-symbols-outlined" aria-hidden="true">arrow_outward</span>
        </a>

        @if (privacyHasError()) {
        <small [id]="privacyErrorId" class="contact-form__error">{{ content().privacyRequiredError }}</small>
        }
      </div>

      <button class="bp-button bp-button--accent" type="submit" [disabled]="isSubmitting()">
        <span>{{ isSubmitting() ? content().sendingLabel : content().submitLabel }}</span>
        <span class="material-symbols-outlined" aria-hidden="true">send</span>
      </button>

      @if (status()) {
      <p class="contact-form__status" role="status" aria-live="polite" aria-atomic="true">{{ status() }}</p>
      }
    </div>

    <fieldset class="contact-form__topics">
      <legend>{{ content().topicLabel }}</legend>
      <p>{{ content().topicHint }}</p>

      <div class="contact-form__topic-grid" role="group" [attr.aria-label]="content().topicLabel">
        @for (topic of content().topics; track topic.value) {
        <button class="contact-form__topic" type="button" [class.is-active]="topicIsSelected(topic)"
          [attr.aria-pressed]="topicIsSelected(topic)" (click)="toggleTopic(topic)">
          <span class="material-symbols-outlined" aria-hidden="true">{{ topic.icon }}</span>
          <span>{{ topic.label }}</span>
        </button>
        }
      </div>
    </fieldset>
  </div>
</form>
