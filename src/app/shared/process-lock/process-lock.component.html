<!-- src/app/shared/process-lock/process-lock.component.html -->
<section #sectionRef class="process-lock" id="process" [style.--step-total]="steps.length + 1">
  <div class="process-lock__sticky">
    <div class="process-lock__backdrop" aria-hidden="true"></div>

    <div class="process-lock__intro">
      <p class="bp-eyebrow">{{ eyebrow }}</p>
      <h2>{{ title }}</h2>
      @if (subtitle) {
      <p>{{ subtitle }}</p>
      }
      @if (hint) {
      <span>{{ hint }}</span>
      }
    </div>

    <div class="process-lock__object" [style.transform]="objectTransform()" aria-hidden="true">
      <div class="process-lock__cube">
        <i></i>
        <i></i>
        <i></i>
      </div>
      <div class="process-lock__orbit"></div>
    </div>

    <div class="process-lock__steps" aria-label="Prozessschritte">
      @for (step of steps; track step.number; let index = $index) {
      <article class="process-lock__step" [class.process-lock__step--active]="isStepVisible(index)">
        <span>{{ step.number }}</span>
        <h3>{{ step.title }}</h3>
        <p>{{ step.text }}</p>
        <code>{{ step.command }}</code>
      </article>
      }
    </div>
  </div>
</section>
