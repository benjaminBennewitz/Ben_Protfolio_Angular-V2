<!-- src/app/shared/pixel-sprite/pixel-sprite.component.html -->
<svg viewBox="0 0 16 16" focusable="false" aria-hidden="true">
  @switch (kind) {
    @case ('bird') {
      <g class="pixel-sprite__bird-body">
        <rect x="5" y="7" width="5" height="3" />
        <rect x="9" y="6" width="2" height="2" />
        <rect x="11" y="7" width="2" height="1" />
        <rect x="4" y="8" width="2" height="1" />
        <rect x="7" y="10" width="2" height="1" />
      </g>
      <g class="pixel-sprite__bird-wing pixel-sprite__bird-wing--up">
        <rect x="5" y="4" width="2" height="3" />
        <rect x="6" y="3" width="2" height="2" />
        <rect x="8" y="4" width="1" height="3" />
      </g>
      <g class="pixel-sprite__bird-wing pixel-sprite__bird-wing--down">
        <rect x="5" y="9" width="2" height="3" />
        <rect x="6" y="11" width="3" height="2" />
        <rect x="8" y="9" width="1" height="2" />
      </g>
    }

    @case ('tree') {
      <g class="pixel-sprite__tree-crown">
        <rect x="5" y="2" width="6" height="2" />
        <rect x="3" y="4" width="10" height="3" />
        <rect x="2" y="7" width="12" height="3" />
        <rect x="4" y="10" width="8" height="2" />
      </g>
      <g class="pixel-sprite__tree-trunk">
        <rect x="7" y="10" width="2" height="5" />
        <rect x="6" y="14" width="4" height="1" />
      </g>
    }

    @case ('flower') {
      <g class="pixel-sprite__flower-head">
        <rect x="6" y="3" width="4" height="4" />
        <rect x="7" y="2" width="2" height="1" />
        <rect x="5" y="4" width="1" height="2" />
        <rect x="10" y="4" width="1" height="2" />
        <rect x="7" y="7" width="2" height="1" />
      </g>
      <g class="pixel-sprite__flower-stem">
        <rect x="7" y="7" width="1" height="7" />
        <rect x="8" y="10" width="2" height="1" />
        <rect x="5" y="12" width="2" height="1" />
      </g>
    }

    @case ('cloud-a') {
      <rect x="2" y="8" width="10" height="3" />
      <rect x="4" y="6" width="4" height="2" />
      <rect x="8" y="7" width="3" height="2" />
      <rect x="11" y="8" width="2" height="2" />
    }

    @case ('cloud-b') {
      <rect x="1" y="8" width="12" height="3" />
      <rect x="3" y="6" width="3" height="2" />
      <rect x="6" y="5" width="4" height="3" />
      <rect x="10" y="7" width="3" height="2" />
    }

    @case ('cloud-c') {
      <rect x="2" y="8" width="11" height="3" />
      <rect x="4" y="7" width="3" height="2" />
      <rect x="7" y="5" width="3" height="3" />
      <rect x="10" y="7" width="2" height="2" />
      <rect x="1" y="9" width="2" height="1" />
    }

    @case ('sun') {
      <g class="pixel-sprite__sun-rays">
        <rect x="7" y="1" width="2" height="2" />
        <rect x="7" y="13" width="2" height="2" />
        <rect x="1" y="7" width="2" height="2" />
        <rect x="13" y="7" width="2" height="2" />
        <rect x="3" y="3" width="2" height="2" />
        <rect x="11" y="3" width="2" height="2" />
        <rect x="3" y="11" width="2" height="2" />
        <rect x="11" y="11" width="2" height="2" />
      </g>
      <rect x="5" y="5" width="6" height="6" />
    }

    @case ('trex') {
      <g class="pixel-sprite__trex-body">
        <rect x="7" y="1" width="5" height="2" />
        <rect x="6" y="3" width="7" height="3" />
        <rect x="5" y="6" width="7" height="2" />
        <rect x="4" y="8" width="6" height="3" />
        <rect x="2" y="7" width="4" height="2" />
        <rect x="1" y="6" width="2" height="2" />
        <rect x="5" y="10" width="2" height="4" />
        <rect x="8" y="10" width="2" height="4" />
        <rect x="4" y="13" width="3" height="1" />
        <rect x="8" y="14" width="3" height="1" />
        <rect x="10" y="8" width="2" height="1" />
        <rect x="12" y="4" width="1" height="1" class="pixel-sprite__cutout" />
        <rect x="10" y="2" width="1" height="1" class="pixel-sprite__cutout" />
      </g>
    }

    @case ('cactus') {
      <g class="pixel-sprite__cactus-body">
        <rect x="7" y="3" width="2" height="11" />
        <rect x="5" y="6" width="2" height="2" />
        <rect x="4" y="7" width="1" height="3" />
        <rect x="9" y="5" width="2" height="2" />
        <rect x="11" y="6" width="1" height="3" />
        <rect x="6" y="14" width="4" height="1" />
      </g>
    }

    @case ('car') {
      <g class="pixel-sprite__car-body">
        <rect x="2" y="7" width="12" height="4" />
        <rect x="4" y="5" width="7" height="2" />
        <rect x="5" y="4" width="4" height="1" />
        <rect x="11" y="6" width="2" height="1" />
        <rect x="1" y="9" width="2" height="1" />
      </g>
      <g class="pixel-sprite__car-window">
        <rect x="5" y="5" width="2" height="2" />
        <rect x="8" y="5" width="2" height="2" />
      </g>
      <g class="pixel-sprite__car-wheel pixel-sprite__car-wheel--left">
        <rect x="3" y="10" width="3" height="3" />
        <rect x="4" y="11" width="1" height="1" class="pixel-sprite__cutout" />
      </g>
      <g class="pixel-sprite__car-wheel pixel-sprite__car-wheel--right">
        <rect x="10" y="10" width="3" height="3" />
        <rect x="11" y="11" width="1" height="1" class="pixel-sprite__cutout" />
      </g>
    }

    @case ('diskette') {
      <rect x="3" y="2" width="10" height="12" />
      <rect x="5" y="3" width="5" height="4" class="pixel-sprite__cutout" />
      <rect x="5" y="9" width="6" height="4" class="pixel-sprite__cutout" />
      <rect x="6" y="10" width="4" height="1" />
    }
  }
</svg>
