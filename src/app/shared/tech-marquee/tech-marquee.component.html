<!-- src/app/shared/tech-marquee/tech-marquee.component.html -->
<div class="marquee" aria-label="Techstack Leiste" [class.is-dragging]="isDragging()" (pointerdown)="startDrag($event)"
  (pointermove)="drag($event)" (pointerup)="finishDrag($event)" (pointercancel)="finishDrag($event)"
  (pointerleave)="finishDrag($event)">
  <div class="marquee__track">
    <div class="marquee__set">
      @for (item of items; track item + '-primary-' + $index) {
      <span>{{ item }}</span>
      }
    </div>

    <div class="marquee__set" aria-hidden="true">
      @for (item of items; track item + '-mirror-' + $index) {
      <span>{{ item }}</span>
      }
    </div>
  </div>
</div>
