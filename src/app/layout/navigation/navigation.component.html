<!-- src/app/layout/navigation/navigation.component.html -->
<header class="nav" [class.nav--open]="menuOpen()">
  <a class="nav__brand" routerLink="/" fragment="hero" data-cursor="brand" [attr.aria-label]="content().brandLabel"
    (click)="closeMenu()">
    <span class="nav__brand-mark" aria-hidden="true">B²</span>
    <span class="nav__brand-text">break<br>the grid</span>
  </a>

  <nav class="nav__links" [attr.aria-label]="content().menu">
    <a routerLink="/" fragment="hero" (click)="closeMenu()">01_{{ content().home }}</a>
    <a routerLink="/" fragment="about" (click)="closeMenu()">02_{{ content().about }}</a>
    <a routerLink="/" fragment="skills" (click)="closeMenu()">03_{{ content().skills }}</a>
    <a routerLink="/" fragment="projects" (click)="closeMenu()">04_{{ content().projects }}</a>
    <a routerLink="/blog" (click)="closeMenu()">05_{{ content().blog }}</a>
    <a routerLink="/" fragment="process" (click)="closeMenu()">06_{{ content().process }}</a>
    <a routerLink="/" fragment="faq" (click)="closeMenu()">07_{{ content().faq }}</a>
    <a routerLink="/" fragment="contact" (click)="closeMenu()">08_{{ content().contact }}</a>
  </nav>

  <div class="nav__actions">
    <button class="nav__action nav__theme" type="button" [class.is-flipping]="themeIsSwitching()"
      [attr.aria-label]="content().theme" (click)="toggleTheme()">
      <span class="material-symbols-outlined nav__theme-icon" aria-hidden="true">{{ themeService.isLight() ? 'dark_mode' : 'light_mode' }}</span>
    </button>

    <button class="nav__action nav__language" type="button" [class.is-flipping]="languageIsSwitching()"
      [attr.aria-label]="content().language" (click)="toggleLanguage()">
      {{ languageService.language().toUpperCase() }}
    </button>

    <a class="nav__action nav__achievement" routerLink="/achievements" [attr.aria-label]="content().achievementLabel"
      (click)="closeMenu()">
      <span class="material-symbols-outlined" aria-hidden="true">emoji_events</span>
    </a>

    <button class="nav__action nav__access" type="button" [attr.aria-label]="accessLabel()" (click)="openAccessPanel()">
      <span class="material-symbols-outlined" aria-hidden="true">accessibility_new</span>
    </button>

    <a class="nav__contact" routerLink="/" fragment="contact" [attr.aria-label]="content().contactAccessLabel"
      (click)="closeMenu()">
      <span>// terminal_access</span>
    </a>

    <button class="nav__burger" type="button" [attr.aria-label]="menuOpen() ? content().close : content().menu"
      [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
