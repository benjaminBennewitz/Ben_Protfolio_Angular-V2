<!-- src/app/pages/thank-you-page/thank-you-page.component.html -->
<main class="thank-you bp-section">
  <div class="thank-you__layout bp-container">
    <section class="thank-you__copy" aria-labelledby="thank-you-title">
      <a class="thank-you__back" routerLink="/" fragment="hero">
        <span class="material-symbols-outlined" aria-hidden="true">keyboard_backspace</span>
        <span>{{ content().backLabel }}</span>
      </a>

      <p class="bp-eyebrow">{{ content().eyebrow }}</p>
      <h1 id="thank-you-title">{{ content().title }}</h1>
      <p class="bp-subtitle">{{ content().text }}</p>
    </section>

    @if (isDialogVisible()) {
    <bp-system-dialog class="thank-you__dialog" [title]="content().dialogTitle"
      [closeLabel]="content().dialogCloseLabel" (closed)="closeDialog()">
      <div class="bp-dos-window__body">
        @for (line of content().dialogLines; track $index) {
        <p>{{ line }}</p>
        }
      </div>
    </bp-system-dialog>
    }
  </div>
</main>
